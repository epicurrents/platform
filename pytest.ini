[pytest]
DJANGO_SETTINGS_MODULE = epicurrents.settings.test_platform
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    require_fuse: needs a usable libfuse (fusepy + libfuse2/macFUSE); skipped automatically when the library does not resolve
    require_edf: needs a real EDF recording in testdata/ (or EPICURRENTS_SMOKE_EDF); skipped when absent
